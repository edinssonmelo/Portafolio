server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Legacy 301 redirects: old unprefixed URLs (already indexed) → locale-prefixed
    # English-first content (home/projects/services) goes to /en, Spanish-first (about/blog/planes/cotización) goes to /es.
    location = /about { return 301 /es/about; }
    location = /blog { return 301 /es/blog; }
    location = /planes { return 301 /es/planes; }
    location = /cotizacion/sistema-barber { return 301 /es/cotizacion/sistema-barber; }
    location ~ ^/blog/(.+)$ { return 301 /es/blog/$1; }
    location = /projects { return 301 /en/projects; }
    location ~ ^/projects/(.+)$ { return 301 /en/projects/$1; }
    location = /services { return 301 /en/services; }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite hashed JS/CSS bundles only (safe to cache immutably)
    location ~* ^/assets/index-[a-zA-Z0-9_-]+\.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Stable filenames in /assets/ (hero, logos, icons): revalidate after deploy
    location ^~ /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, must-revalidate";
        try_files $uri =404;
    }

    # Screenshots share stable filenames; allow refresh when files are replaced
    location ^~ /screenshots/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, must-revalidate";
        try_files $uri =404;
    }

    location ~* \.(?:css|js|mjs|png|jpe?g|gif|ico|svg|webp|avif|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, must-revalidate";
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache";
    }
}
